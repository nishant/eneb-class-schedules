name: Refresh schedules

# Regenerates docs/ from the live Testudo schedule and commits any changes.
# - "Run workflow" button (Actions tab) for an on-demand refresh
# - monthly, so the site stays current with no manual work
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 1 * *' # 12:00 UTC on the 1st of each month

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm start
      - name: Commit updated schedules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No schedule changes."
          else
            git commit -m "chore: refresh schedules ($(date -u +%Y-%m-%d))"
            git push
          fi
